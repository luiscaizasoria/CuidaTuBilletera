name: Deploy API

# Despliegue manual del Worker a Cloudflare. Ver docs/006-DESPLIEGUE.md.
# No se dispara con pull_request ni con push: solo workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Solo se publica desde main. En otra rama el job se omite sin pedir aprobación.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Comprobar que el SHA es el vigente de main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          current="$(gh api "repos/${REPO}/commits/refs/heads/main" --jq .sha)"
          echo "SHA a publicar: ${GITHUB_SHA}"
          echo "SHA vigente de main: ${current}"
          if [ "${GITHUB_SHA}" != "${current}" ]; then
            echo "::error::main avanzó después de iniciar la ejecución. Vuelve a ejecutar el workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --workspace api
      - run: npm test --workspace api
      # Invariantes de api/wrangler.jsonc en modo estricto (docs/011): sin marcadores
      # REEMPLAZAR_*, ids con formato válido y PROD separado de DEV. Falla mientras queden
      # marcadores. No usa credenciales.
      - name: Verificar configuración de wrangler (estricto)
        run: node scripts/verificar-config-wrangler.js --estricto

      # Build sin despliegue (script `build` de api: wrangler deploy --dry-run --env prod).
      # No usa credenciales.
      - run: npm run build --workspace api

      - name: Comprobar el entorno prod con dry-run
        working-directory: api
        shell: bash
        run: |
          npx --no-install wrangler deploy --dry-run --env prod \
            --outdir "${RUNNER_TEMP}/dry-run-prod" 2>&1 | tee "${RUNNER_TEMP}/dry-run.log"
          if ! grep -qF 'env.DB (controlgastos-db)' "${RUNNER_TEMP}/dry-run.log"; then
            echo "::error::El dry-run de --env prod no enlaza env.DB con controlgastos-db."
            exit 1
          fi
          if grep -qF 'controlgastos-db-dev' "${RUNNER_TEMP}/dry-run.log"; then
            echo "::error::El dry-run de --env prod referencia la base de DEV (controlgastos-db-dev)."
            exit 1
          fi

      - name: Publicar Worker
        id: deploy
        working-directory: api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          short="${GITHUB_SHA:0:7}"
          npx --no-install wrangler deploy --env prod \
            --message "gh-actions ${GITHUB_SHA} run ${GITHUB_RUN_ID}" \
            --tag "${short}" 2>&1 | tee "${RUNNER_TEMP}/deploy.log"

          # Control posterior: la versión REALMENTE activa (100 %) debe incluir el binding
          # JWT_SECRET. Solo se leen metadatos (nombre y tipo del binding); nunca el valor.
          # Distingue «no se pudo verificar» de «binding ausente». Corre en este paso porque
          # es el único que tiene el token de Cloudflare.
          npx --no-install wrangler deployments status --env prod --json \
            > "${RUNNER_TEMP}/deployment.json" 2> "${RUNNER_TEMP}/deployment.err" || {
            echo "::error::No se pudo verificar JWT_SECRET: falló la lectura del despliegue activo."
            cat "${RUNNER_TEMP}/deployment.err"
            exit 1
          }
          active="$(node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const v = (d.versions || []).find((x) => x.percentage === 100);
            process.stdout.write(v ? String(v.version_id || v.id || "") : "");
          ' "${RUNNER_TEMP}/deployment.json")" || active=""
          if ! printf '%s' "${active}" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::No se pudo verificar JWT_SECRET: no se identificó una versión activa al 100 %."
            exit 1
          fi
          echo "Versión activa: ${active}"
          npx --no-install wrangler versions view "${active}" --env prod --json \
            > "${RUNNER_TEMP}/version.json" 2> "${RUNNER_TEMP}/version.err" || {
            echo "::error::No se pudo verificar JWT_SECRET: falló la lectura de la versión ${active}."
            cat "${RUNNER_TEMP}/version.err"
            exit 1
          }
          if node -e '
            const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const b = (v.resources && v.resources.bindings) || [];
            const ok = b.some((x) => x.name === "JWT_SECRET" && x.type === "secret_text");
            process.exit(ok ? 0 : 3);
          ' "${RUNNER_TEMP}/version.json"; then
            echo "JWT_SECRET (secret_text) presente en la versión activa ${active}."
          else
            echo "::error::La versión activa ${active} NO incluye el binding JWT_SECRET. Crea el secreto con «wrangler versions secret put» y vuelve a desplegar (docs/011)."
            exit 1
          fi

      - name: Verificar GET /health y GET /me
        id: smoke
        if: success() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "${WORKER_URL}" ]; then
            echo "::warning::WORKER_URL no está configurada: verificación HTTP pendiente."
            echo "result=pending" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${WORKER_URL}" in
            https://*) ;;
            *)
              echo "::error::WORKER_URL debe empezar con https://"
              echo "result=failed" >> "${GITHUB_OUTPUT}"
              exit 1
              ;;
          esac
          echo "result=failed" >> "${GITHUB_OUTPUT}"
          body="$(curl --fail --silent --show-error --max-time 10 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "${WORKER_URL%/}/health")"
          echo "Respuesta: ${body}"
          if [ "${body}" != '{"status":"ok"}' ]; then
            echo "::error::Respuesta inesperada de /health."
            exit 1
          fi
          # Distingue el Worker nuevo (con la ruta /me) del anterior del 2026-10-11; NO
          # distingue PROD de DEV: WORKER_URL debe ser la URL de PROD (se comprueba además
          # en la fase F6 del plan). Sin token debe responder 401 con Cache-Control: no-store.
          status="$(curl --silent --show-error --max-time 10 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/me.body" --dump-header "${RUNNER_TEMP}/me.headers" \
            --write-out '%{http_code}' "${WORKER_URL%/}/me")"
          echo "GET /me sin token: HTTP ${status}"
          if [ "${status}" != "401" ]; then
            echo "::error::GET /me sin token debía responder 401 (respuesta: ${status})."
            exit 1
          fi
          if ! tr -d '\r' < "${RUNNER_TEMP}/me.headers" | grep -iqE '^cache-control:.*no-store'; then
            echo "::error::GET /me sin token no devolvió Cache-Control: no-store."
            exit 1
          fi
          # Sonda de configuración sin token de Google: la API valida cliente Web, JWT_SECRET
          # (≥ 32 caracteres), lista Android y existencia del binding DB antes de leer el
          # cuerpo. Un cuerpo vacío da 400 con esa configuración y 500 CONFIG_ERROR si falta
          # algo. No prueba el contenido de la lista Android (lo cubre el verificador estricto)
          # ni que D1 sea la base correcta. No llama a Google ni escribe en D1.
          status="$(curl --silent --show-error --max-time 10 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            --output /dev/null --write-out '%{http_code}' "${WORKER_URL%/}/auth/google")"
          echo "POST /auth/google con cuerpo vacío: HTTP ${status}"
          if [ "${status}" != "400" ]; then
            echo "::error::POST /auth/google con cuerpo vacío debía responder 400 (respuesta: ${status}); 500 indica configuración incompleta."
            exit 1
          fi
          echo "result=passed" >> "${GITHUB_OUTPUT}"

      - name: Resumen del despliegue
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          version="$(grep -i 'Version ID' "${RUNNER_TEMP}/deploy.log" 2>/dev/null | head -n 1 || true)"
          case "${DEPLOY_OUTCOME}" in
            success) publication="exitosa" ;;
            failure) publication="FALLIDA" ;;
            *) publication="no ejecutada" ;;
          esac
          case "${SMOKE_RESULT}" in
            passed) http="aprobada" ;;
            pending) http="PENDIENTE (WORKER_URL no configurada; no se ejecutó)" ;;
            failed) http="FALLIDA" ;;
            *) http="no ejecutada" ;;
          esac
          {
            echo "## Despliegue de controlgastos-api"
            echo ""
            echo "- Entorno: prod"
            echo "- Worker: controlgastos-api"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_RUN_ID} (intento ${GITHUB_RUN_ATTEMPT})"
            echo "- Lanzado por: ${GITHUB_ACTOR}"
            echo "- Publicación: ${publication}"
            echo "- Verificación HTTP de /health y /me: ${http}"
            if [ -n "${version}" ]; then echo "- ${version}"; fi
            if [ "${DEPLOY_OUTCOME}" = "failure" ] || [ "${SMOKE_RESULT}" = "failed" ]; then
              echo ""
              echo "Consulta el rollback manual en docs/006-DESPLIEGUE.md."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
