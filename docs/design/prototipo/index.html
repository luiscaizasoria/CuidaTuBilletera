<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuidaTuBilletera - Prototipo visual (iteración 3)</title>
<style>
/* Tokens: docs/008 §11 (iteración 3). Sin gradientes CSS: la profundidad se hace con color sólido + capas
   semitransparentes (opacity) y círculos, igual que en la app (View con opacity / borderRadius).
   Las medidas de componentes también son variables: docs/design (render SVG del scratchpad) las lee de aquí. */
:root{
  /* marca: verde azulado del ícono. SOLO acción primaria, FAB, tarjeta de saldo y foco */
  --brand-800:#0B4A46;--brand-700:#0F5F5A;--brand-500:#1F8A80;--brand-100:#D3EBF0;--brand-ink:#0B4A46;--on-brand-soft:#E6F7F4;
  /* superficies y texto */
  --bg:#FFFBF5;--surface:#FFFFFF;--text:#17211F;--text-2:#4B5653;--text-3:#5F6B68;--border:#EEE7DC;--border-strong:#7E8A86;--seg-bg:#F3EEE6;
  /* semánticos (fijos) */
  --income:#12804A;--income-text:#0E6A3D;--income-soft:#D9F4E4;
  --expense:#D13A2F;--expense-text:#B42A20;--expense-soft:#FFE1D9;
  /* acento */
  --yellow:#FFC93C;--yellow-soft:#FFF1C2;--yellow-text:#6B4E00;
  /* color por módulo (docs/007 §3.6) */
  --cuenta-tile:#D3EBF0;--cuenta-ink:#0B4A46;
  --mov-tile:#FFEDA6;--mov-ink:#5C4000;--mov-strong:#F5A524;
  --cal-tile:#DCEBFF;--cal-ink:#174C86;--cal-strong:#2563C9;
  --rep-tile:#ECE4FF;--rep-ink:#4E2DA3;
  --mas-tile:#E3E8EF;--mas-ink:#334155;
  /* paleta de cuentas (docs/007 §5.2.4): fondo de tarjeta / mosaico del ícono; índice = hash(id) mod 6 */
  --acc0-card:#E3F6F8;--acc0-tile:#BDE9EF;
  --acc1-card:#F0EBFF;--acc1-tile:#D9CCFF;
  --acc2-card:#FFF0E0;--acc2-tile:#FFD6A8;
  --acc3-card:#E7F1FF;--acc3-tile:#C5DBFF;
  --acc4-card:#FDEAF2;--acc4-tile:#F8CADD;
  --acc5-card:#FFF6D6;--acc5-tile:#FFE58A;
  --acc-deco-op:.45;
  /* manchas decorativas del fondo (círculos con opacidad) */
  --blob-yellow:#FFD966;--blob-yellow-op:.35;--blob-peach:#FFB59A;--blob-peach-op:.25;--blob-sky:#9CC4FF;--blob-sky-op:.25;
  /* escala */
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --sh1:0 1px 2px rgba(23,33,31,.06),0 2px 8px rgba(23,33,31,.06);--sh2:0 6px 16px rgba(15,95,90,.22);
  /* medidas de componentes (dp) */
  --sbar-h:24px;--pad-x:16px;--login-pig:250px;--hdr-pig:72px;--pig-zoom:1.4;--avatar:40px;--brand-fs:14px;--title-fs:26px;
  --total-amt:24px;--acc-card-min:88px;--acc-ico:52px;--acc-ico-r:16px;--acc-name:17px;--acc-bal:22px;--acc-gap:10px;
  --btn-h:52px;--ctx-h:56px;--tab-h:62px;--hero-min:132px;--hero-pig:104px;--fab-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE9DF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
.notice{background:var(--yellow-soft);color:var(--yellow-text);border:1px solid #E8C560;border-radius:var(--r-pill);padding:6px 14px;font-size:13px;font-weight:700;margin-bottom:8px;text-align:center}
.demo{font-size:13px;color:var(--text-2);margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo label{display:flex;gap:6px;align-items:center;min-height:32px;cursor:pointer}
.phone{--w:390px;--h:800px;position:relative;width:calc(var(--w) + 16px);height:calc(var(--h) + 16px);background:var(--bg);border-radius:36px;border:8px solid #1E2B29;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.phone.s360{--w:360px;--h:640px}
.phone.s412{--w:412px;--h:915px;--pad-x:20px;--hdr-pig:96px;--acc-card-min:92px}
.sbar{height:var(--sbar-h);flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:700;color:var(--text);background:var(--bg);position:relative;z-index:2}
.sbar.surf{background:var(--surface)}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 var(--pad-x) var(--s5);position:relative}
.scroll.pad-fab{padding-bottom:104px}
h1,h2,h3,p{margin:0}
.t-title{font-size:24px;font-weight:800;line-height:30px}
.t-title.acc::after{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--yellow);margin-top:4px}
.t-h2{font-size:18px;font-weight:700;line-height:24px}
.t-body{font-size:15px;line-height:22px}
.t-small{font-size:13px;line-height:18px;color:var(--text-2)}
.t-amount-xl{font-size:34px;font-weight:800;line-height:40px;font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.inc{color:var(--income-text)}.exp{color:var(--expense-text)}
.amt-inc{color:var(--income)}.amt-exp{color:var(--expense)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand-700);outline-offset:2px}
.hdr{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--pad-x) var(--s3);min-height:56px;flex:none}
.hdr .back{min-height:48px;min-width:48px;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--text);border-radius:var(--r-md);padding:0 6px;font-size:15px}
.titlerow{display:flex;align-items:center;gap:10px;margin:var(--s3) 0 var(--s2)}
.ticon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.ticon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.f-cuenta{background:var(--cuenta-tile);color:var(--cuenta-ink)}.f-movimientos{background:var(--mov-tile);color:var(--mov-ink)}.f-calendario{background:var(--cal-tile);color:var(--cal-ink)}.f-reportes{background:var(--rep-tile);color:var(--rep-ink)}.f-mas{background:var(--mas-tile);color:var(--mas-ink)}
/* ---- paleta de cuentas ---- */
.accp0{--acc-card:var(--acc0-card);--acc-tile:var(--acc0-tile)}.accp1{--acc-card:var(--acc1-card);--acc-tile:var(--acc1-tile)}.accp2{--acc-card:var(--acc2-card);--acc-tile:var(--acc2-tile)}
.accp3{--acc-card:var(--acc3-card);--acc-tile:var(--acc3-tile)}.accp4{--acc-card:var(--acc4-card);--acc-tile:var(--acc4-tile)}.accp5{--acc-card:var(--acc5-card);--acc-tile:var(--acc5-tile)}
.acc-ico{width:var(--acc-ico);height:var(--acc-ico);border-radius:var(--acc-ico-r);display:grid;place-items:center;font-size:28px;flex:none;background:var(--acc-tile);overflow:hidden}
.acc-ico img{width:120%;height:120%;object-fit:contain}
/* ---- barra de contexto de cuenta (docs/007 §3.5): NEUTRA e igual en todas las pantallas internas ---- */
.ctx{flex:none;background:var(--surface);display:flex;align-items:center;gap:6px;padding:4px 8px 6px 2px;min-height:var(--ctx-h);border-bottom:1px solid var(--border);box-shadow:0 2px 6px rgba(23,33,31,.04);position:relative;z-index:1}
.ctx .ctx-back{min-height:48px;min-width:48px;padding:0 8px;border-radius:var(--r-md);font-weight:800;font-size:14px;color:var(--text);display:flex;align-items:center;gap:2px;white-space:nowrap;flex:none}
.ctx .sep{width:1px;align-self:stretch;margin:10px 2px;background:var(--border);flex:none}
.ctx-info{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ctx-ico{width:30px;height:30px;border-radius:10px;background:var(--acc-tile);display:grid;place-items:center;font-size:16px;flex:none;overflow:hidden}
.ctx-ico img{width:120%;height:120%;object-fit:contain}
.ctx-name{flex:1 1 auto;min-width:0;font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-bal{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--seg-bg);border-radius:var(--r-pill);padding:4px 8px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--text)}
.ctx-bal.neg{color:var(--expense-text)}
.ctx-err{flex:none;font-size:13px;font-weight:700;color:var(--expense-text);white-space:nowrap}
.ctx-retry{flex:none;min-height:48px;padding:0 8px;font-weight:800;font-size:13px;color:var(--text);text-decoration:underline}
.tag-arch{flex:none;background:var(--yellow-soft);color:var(--yellow-text);border:1px solid #E8C560;font-size:12px;font-weight:800;border-radius:var(--r-pill);padding:2px 8px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #D9D2C6;border-top-color:var(--text-2);animation:rot .8s linear infinite;flex:none}
.ctx.compact{min-height:36px;padding:6px var(--pad-x)}
.ctx.compact .ctx-name{flex:0 1 auto;font-size:14px}
.ctx.compact .dot-sep{color:var(--text-2);flex:none}
.ctx.compact .ctx-bal{background:none;padding:0;font-size:14px}
/* ---- fondo con manchas (Mis cuentas, bienvenida) ---- */
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%}
.blob.y{background:var(--blob-yellow);opacity:var(--blob-yellow-op)}
.blob.p{background:var(--blob-peach);opacity:var(--blob-peach-op)}
.blob.s{background:var(--blob-sky);opacity:var(--blob-sky-op)}
.spark{position:absolute;width:12px;height:4px;border-radius:2px;background:var(--yellow)}
/* ---- Mis cuentas ---- */
.ahdr{position:relative;padding-top:var(--s2)}
.ahdr .top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.ahdr .brandname{font-size:var(--brand-fs);font-weight:800;color:var(--brand-ink);letter-spacing:.01em}
.avatar{width:48px;height:48px;display:grid;place-items:center;margin-right:-4px}
.avatar span{width:var(--avatar);height:var(--avatar);border-radius:50%;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--sh1);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--text)}
.ahdr .mid{display:flex;align-items:flex-end;gap:var(--s2);margin-top:2px}
.ahdr .greet{flex:1;min-width:0;padding-bottom:6px}
.ahdr .hello{font-size:16px;line-height:22px;color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahdr h1{font-size:var(--title-fs);line-height:32px;font-weight:800}
.ahdr h1::after{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--yellow);margin-top:4px}
.ahdr .pigw{position:relative;width:var(--hdr-pig);height:var(--hdr-pig);flex:none}
.ahdr .pigw img{position:absolute;width:calc(100% * var(--pig-zoom));height:calc(100% * var(--pig-zoom));left:calc(50% * (1 - var(--pig-zoom)));top:calc(70% * (1 - var(--pig-zoom)));object-fit:contain}
.total{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh1);padding:12px var(--s4);margin:var(--s3) 0}
.coin{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--text);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.total .amt{font-size:var(--total-amt);font-weight:800;line-height:30px;font-variant-numeric:tabular-nums}
.acard{position:relative;overflow:hidden;width:100%;text-align:left;display:flex;align-items:center;gap:var(--s3);min-height:var(--acc-card-min);background:var(--acc-card);border-radius:20px;padding:12px 14px 12px 12px;margin-bottom:var(--acc-gap);box-shadow:var(--sh1);transition:transform .12s}
.acard:active{transform:scale(.98)}
.acard .deco{position:absolute;width:110px;height:110px;right:-34px;top:-44px;border-radius:50%;background:#fff;opacity:var(--acc-deco-op);pointer-events:none}
.acard .mid{flex:1;min-width:0;position:relative}
.acard .nm{font-weight:800;font-size:var(--acc-name);line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .bal{font-size:var(--acc-bal);font-weight:800;line-height:28px;font-variant-numeric:tabular-nums}
.acard .bal.neg{color:var(--expense-text)}
.acard .chev{position:relative;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--text-2);font-weight:800;font-size:18px;flex:none}
.arch-row{display:flex;align-items:center;gap:6px;min-height:48px;font-weight:700;color:var(--text-2);font-size:15px;padding:0 4px}
.acard.archived{background:#F4F0EA;min-height:64px;box-shadow:none;border:1px solid var(--border)}
/* ---- tarjetas ---- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh1);padding:var(--s4);margin-bottom:var(--s3)}
.hero{position:relative;overflow:hidden;background:var(--brand-700);color:#fff;border-radius:var(--r-xl);padding:20px 20px 22px;margin:var(--s3) 0;box-shadow:var(--sh2);min-height:var(--hero-min)}
.hero .band{position:absolute;width:300px;height:110px;right:-90px;top:-34px;background:var(--brand-500);opacity:.35;transform:rotate(-16deg);border-radius:55px}
.hero .circ{position:absolute;border-radius:50%;background:#fff;opacity:.08}
.hero .pig{position:absolute;right:6px;bottom:-4px;width:var(--hero-pig);height:var(--hero-pig)}
.hero .txt{position:relative;padding-right:96px}
.hero .l{color:var(--on-brand-soft);font-size:14px;font-weight:600}
.hero .busy{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--on-brand-soft);margin-top:2px}
.hero .busy .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.hero .herr{background:var(--surface);color:var(--expense-text);border-radius:var(--r-md);padding:8px 10px;font-weight:700;font-size:14px;margin-top:6px;display:flex;align-items:center;gap:8px}
.hero .herr button{min-height:48px;color:var(--text);text-decoration:underline;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s3)}
.tile{border-radius:var(--r-lg);padding:var(--s3) var(--s4);position:relative;overflow:hidden;background:var(--surface);box-shadow:var(--sh1)}
.tile .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .lb{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.tile .bub{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:900}
.tile.i .bub{background:var(--income-soft);color:var(--income-text)}.tile.e .bub{background:var(--expense-soft);color:var(--expense-text)}
.tile.i .v{color:var(--income)}.tile.e .v{color:var(--expense)}.tile.n .v,.tile.b .v{color:var(--text)}
/* ---- botones ---- */
.btn{min-height:48px;padding:0 var(--s4);border-radius:var(--r-md);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.primary{background:var(--brand-700);color:#fff}
.btn.primary:active{background:var(--brand-800)}
.btn.tall{min-height:var(--btn-h);border-radius:16px}
.btn.secondary{background:var(--surface);color:var(--brand-700);border-color:var(--brand-700)}
.btn.danger{background:var(--surface);color:var(--expense-text);border-color:var(--expense)}
.btn.danger-solid{background:var(--expense);color:#fff}
.btn.ghost{color:var(--text)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.google{background:#fff;color:var(--text);box-shadow:0 4px 14px rgba(23,33,31,.14);border-color:var(--border)}
.btn.google .g{font-weight:900;color:#2563C9;font-size:18px}
/* ---- chips y segmentados ---- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s2) 0}
.chip{min-height:48px;padding:0 var(--s4);border-radius:var(--r-pill);border:1.5px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.sel{background:var(--seg-bg);border-color:var(--text);color:var(--text);font-weight:800}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px;position:relative}
/* Zona táctil efectiva 48 px (equivale a hitSlop {top:6,bottom:6} en RN); aspecto de 36 px intacto. Medir con [data-hit="extended"] */
.chip.sm::after{content:"";position:absolute;left:0;right:0;top:50%;height:48px;transform:translateY(-50%)}
.chips:has(.chip.sm){row-gap:12px}
.mod-mov .chip.sel{background:var(--mov-tile);border-color:var(--mov-ink);color:var(--mov-ink)}
.ty-egreso .chip.sel{background:var(--expense-soft);border-color:var(--expense);color:var(--expense-text)}
.ty-ingreso .chip.sel{background:var(--income-soft);border-color:var(--income);color:var(--income-text)}
.seg{display:flex;background:var(--seg-bg);border-radius:var(--r-pill);padding:4px;margin:var(--s2) 0;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:var(--r-pill);font-weight:700;font-size:15px;color:var(--text-2);border:2px solid transparent}
.seg button.sel{background:var(--surface);color:var(--text);box-shadow:var(--sh1);font-weight:800}
.seg.mod-rep button.sel{background:var(--rep-tile);color:var(--rep-ink);box-shadow:none}
.seg.mod-mov button.sel{background:var(--mov-tile);color:var(--mov-ink);box-shadow:none}
.seg.type{background:none;padding:0;gap:8px}
.seg.type button{min-height:48px;background:var(--surface);border-color:var(--border);border-radius:var(--r-md)}
.seg.type button.sel.gasto{background:var(--expense-soft);border-color:var(--expense);color:var(--expense-text)}
.seg.type button.sel.ingreso{background:var(--income-soft);border-color:var(--income);color:var(--income-text)}
.seg button.sel::before{content:"✓ "}
/* ---- campos ---- */
.tiles.dates{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.dates .field{min-width:0}
.tiles.dates input{min-width:0;max-width:100%}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border-radius:var(--r-md);border:1.5px solid var(--border-strong);padding:0 var(--s3);font:inherit;font-size:16px;background:#fff;color:var(--text)}
.field input:focus{border-color:var(--brand-700);border-width:2px;outline:none;box-shadow:0 0 0 3px var(--brand-100)}
.field .hint{font-size:13px;color:var(--text-2);margin-top:4px}
/* ---- filas ---- */
.row{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) 0;border-bottom:1px solid var(--border);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;color:#fff;font-weight:900}
.cicon.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.day-h{font-size:13px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:var(--s3) 0 2px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:var(--s4) 0 var(--s2)}
.link{color:var(--brand-700);font-weight:700;min-height:48px;min-width:48px;justify-content:center;display:inline-flex;align-items:center;padding:0 4px}
.navb{min-width:48px;min-height:48px;display:inline-grid;place-items:center}
.navb span{width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;font-weight:800;color:var(--text)}
/* ---- barra inferior ---- */
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(23,33,31,.06)}

    {id:'a1',nombre:'Efectivo',inicial:50000,archived:false},

var nid=100;
function seed(){
  var t=[
   ['a1','ingreso','c9',80000,'2026-10-01','Sueldo octubre'],

}
seed();

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(c){var neg=c<0;c=Math.abs(c);var e=Math.floor(c/100),d=('0'+(c%100)).slice(-2);return (neg?'-':'')+'$'+String(e).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+d;}
function signed(t){return (t.tipo==='ingreso'?'+':'−')+money(t.monto);}
function cat(id){return CATS.filter(function(c){return c.id===id;})[0];}
function accById(id){return S.accounts.filter(function(a){return a.id===id;})[0];}
function acc(){return accById(S.route.acc);}
function txsOf(a){return S.txs.filter(function(t){return t.acc===a&&!t.voided;});}
function balance(a){var ac=accById(a);var b=ac.inicial;txsOf(a).forEach(function(t){b+=t.tipo==='ingreso'?t.monto:-t.monto;});return b;}
function sum(list,tipo){return list.filter(function(t){return t.tipo===tipo;}).reduce(function(s,t){return s+t.monto;},0);}
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function parse(d){var p=d.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function fmt(dt){return dt.toISOString().slice(0,10);}
function addDays(d,n){var dt=parse(d);dt.setUTCDate(dt.getUTCDate()+n);return fmt(dt);}
function monthLabel(m){var p=m.split('-');var n=MESES[+p[1]-1];return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0];}
function shiftMonth(m,n){var p=m.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1+n,1));return d.toISOString().slice(0,7);}
function dayLabel(d){if(d===TODAY)return 'Hoy';if(d===addDays(TODAY,-1))return 'Ayer';var dt=parse(d);return DIAS[dt.getUTCDay()]+' '+dt.getUTCDate()+' de '+MESES[dt.getUTCMonth()];}
function weekRange(){var dt=parse(TODAY);var dow=(dt.getUTCDay()+6)%7;var s=addDays(TODAY,-dow);return [s,addDays(s,6)];}
function cicon(c,sm){return '<span class="cicon'+(sm?' sm':'')+'" aria-hidden="true" style="background:'+c.fill+'">'+(c.glyph||c.emoji)+'</span>';}
function sortDesc(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0;}
function parseCents(s){if(!/^\d+(\.\d{0,2})?$/.test(s))return NaN;var p=s.split('.');return +p[0]*100+(p[1]?+(p[1]+'0').slice(0,2):0);}
/* Color estable por cuenta (docs/007 §5.2.4, decisión 14.18 a): hash(id) mod 6, nunca por posición. */
function accPal(a){var x=0;for(var i=0;i<a.id.length;i++)x=(Math.imul(x,31)+a.id.charCodeAt(i))>>>0;return 'accp'+(x%6);}
/* Ícono decorativo por palabra clave del nombre (decisión 14.19 b); la alcancía es el PNG de la marca. */
var PIG='<img src="../assets/adaptive-icon-foreground.png" alt="">';
function accIcon(a){var n=a.nombre.toLowerCase();if(/tarjeta/.test(n))return '💳';if(/banco/.test(n))return '🏦';if(/ahorro/.test(n))return PIG;return '👛';}
function firstName(){var n=(S.user.nombre||'').trim().split(/\s+/)[0];return n;}
function initial(){var n=firstName()||S.user.email||'?';return n.charAt(0).toUpperCase();}
function blobs(set){return '<div class="blobs" aria-hidden="true">'+set.map(function(b){return '<span class="blob '+b[0]+'" style="width:'+b[3]+'px;height:'+b[3]+'px;'+b[1]+';'+b[2]+'"></span>';}).join('')+'</div>';}

function nav(r,keep){S.route=r;S.modal=null;if(!keep){S.form=null;}render();}
function snack(msg){S.snack=msg;render();clearTimeout(snack.t);snack.t=setTimeout(function(){S.snack=null;render();},3000);}
function guide(key,text){if(S.guides[key])return '';return '<div class="guide" role="note"><span style="flex:1">'+text+'</span><button data-act="guide" data-k="'+key+'" aria-label="Entendido, cerrar ayuda">Entendido</button></div>';}

/* Relectura del saldo tras guardar/anular (simula GET /accounts/:id/balance). */
var BAL_DELAY=900;
function refreshBalance(){
  var id=S.route.acc;S.ctxBal.state='loading';render();
  clearTimeout(refreshBalance.t);
  refreshBalance.t=setTimeout(function(){
    if(S.route.acc!==id)return;
    if(document.getElementById('simErr').checked){S.ctxBal.state='error';}
    else{S.ctxBal.value=balance(id);S.ctxBal.state='ok';}
    render();
  },BAL_DELAY);
}

 cuentas:'<img class="big" src="../assets/adaptive-icon-foreground.png" alt="" aria-hidden="true">',

function empty(ill,title,text,btn){return '<div class="empty">'+ILL[ill]+'<h3 class="t-h2">'+title+'</h3><p>'+text+'</p>'+(btn||'')+'</div>';}

/* ---------- filas ---------- */
function txRow(t){var c=cat(t.cat);return '<button class="row" data-act="tx" data-id="'+t.id+'" aria-label="'+esc((t.tipo==='ingreso'?'Ingreso ':'Gasto ')+c.nombre+(t.nota?', '+t.nota:'')+' '+money(t.monto))+'">'+cicon(c)+'<span class="grow"><div class="ttl" title="'+esc(t.nota||c.nombre)+'">'+esc(t.nota||c.nombre)+'</div><div class="t-small">'+c.nombre+' · '+dayLabel(t.fecha)+'</div></span><span class="amt '+(t.tipo==='ingreso'?'amt-inc':'amt-exp')+'">'+signed(t)+'</span></button>';}
function groupByDay(list){var out='',cur='';list.slice().sort(sortDesc).forEach(function(t){if(t.fecha!==cur){cur=t.fecha;out+='<div class="day-h">'+dayLabel(cur)+'</div>';}out+=txRow(t);});return out;}

/* ---------- barra de contexto de cuenta (docs/007 §3.5) ----------
   mode: 'full' (‹ Mis cuentas) | 'readonly' (salida propia: exit=[act,label,aria]) | 'compact' (una línea, sin acción)
   showBal: false en la pestaña Cuenta. */
function ctxBar(a,opt){
  opt=opt||{};var mode=opt.mode||'full',showBal=opt.showBal!==false,b=S.ctxBal;
  var label='Cuenta '+a.nombre;
  var balHtml='';
  if(showBal){
    if(b.state==='error'){label+=', saldo no disponible';balHtml='<span class="ctx-err">Saldo no disponible</span>';}
    else{
      label+=', '+(opt.balLabel||'saldo')+' '+money(b.value);
      if(b.state==='loading')label+=', actualizando saldo';
      balHtml='<span class="ctx-bal'+(b.value<0?' neg':'')+'" data-testid="ctx-bal">'+money(b.value)+(b.state==='loading'&&mode!=='compact'?'<span class="spin" aria-hidden="true"></span>':'')+'</span>';
    }
  }
  if(a.archived)label+=', archivada';
  var tag=a.archived?'<span class="tag-arch">Archivada</span>':'';
  if(mode==='compact'){
    return '<div class="ctx compact" data-testid="ctx" data-mode="compact"><div class="ctx-info" role="text" aria-label="'+esc(label)+'"><span class="ctx-name" data-testid="ctx-name" title="'+esc(a.nombre)+'">'+esc(a.nombre)+'</span>'+(showBal&&b.state!=='error'?'<span class="dot-sep" aria-hidden="true">·</span>':'')+balHtml+tag+'</div></div>';
  }
  var back=mode==='full'?'<button class="ctx-back" data-act="toAccounts" aria-label="Volver a Mis cuentas">‹ Mis cuentas</button>':'<button class="ctx-back" data-act="'+opt.exit[0]+'" aria-label="'+esc(opt.exit[2])+'">‹ '+esc(opt.exit[1])+'</button>';
  var retry=showBal&&b.state==='error'?'<button class="ctx-retry" data-act="retryBal">Reintentar</button>':'';
  return '<div class="ctx" data-testid="ctx" data-mode="'+mode+'">'+back+'<span class="sep" aria-hidden="true"></span><div class="ctx-info" role="text" aria-label="'+esc(label)+'" aria-busy="'+(b.state==='loading')+'"><span class="ctx-ico '+accPal(a)+'" aria-hidden="true">'+accIcon(a)+'</span><span class="ctx-name" data-testid="ctx-name" title="'+esc(a.nombre)+'">'+esc(a.nombre)+'</span>'+tag+balHtml+'</div>'+retry+'</div>';
}

function donut(list){
  var by={};list.filter(function(t){return t.tipo==='egreso';}).forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.monto;});
  var ids=Object.keys(by).sort(function(a,b){return by[b]-by[a];}),tot=ids.reduce(function(s,i){return s+by[i];},0);
  if(!tot)return '';
  var R=52,C=2*Math.PI*R,off=0,segs='',leg='';
  ids.forEach(function(id){var c=cat(id),len=by[id]/tot*C;segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+c.fill+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';off+=len;leg+='<div><span class="dot" style="background:'+c.fill+'"></span><span style="flex:1">'+c.nombre+'</span><b>'+Math.round(by[id]/tot*100)+'%</b></div>';});
  return '<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Gráfico de dona de gastos por categoría">'+segs+'<text x="70" y="66" text-anchor="middle" font-size="11" fill="#4B5653">Total</text><text x="70" y="84" text-anchor="middle" font-size="14" font-weight="800" fill="#17211F">'+money(tot)+'</text></svg><div class="legend">'+leg+'</div></div>';
}

  h+='<div class="seg mod-rep" role="radiogroup" aria-label="Modo de período">'+[['mes','Mes'],['anio','Año'],['rango','Rango']].map(function(o){return '<button role="radio" aria-checked="'+(r.mode===o[0])+'" class="'+(r.mode===o[0]?'sel':'')+'" data-act="rm" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(r.mode==='mes')h+='<div class="sec-h" style="margin-top:0"><button class="link" data-act="rprev" aria-label="Mes anterior">‹</button><b>'+monthLabel(r.month)+'</b><button class="link" data-act="rnext" aria-label="Mes siguiente">›</button></div>';
  if(r.mode==='anio')h+='<div class="sec-h" style="margin-top:0"><button class="link" data-act="rprev" aria-label="Año anterior">‹</button><b>'+r.year+'</b><button class="link" data-act="rnext" aria-label="Año siguiente">›</button></div>';
  if(r.mode==='rango')h+='<div class="tiles dates"><div class="field" style="margin:0"><label for="rf">Desde</label><input type="date" id="rf" data-bind="rep.from" data-render="1" value="'+r.from+'"></div><div class="field" style="margin:0"><label for="rt">Hasta</label><input type="date" id="rt" data-bind="rep.to" data-render="1" value="'+r.to+'"></div></div>';
  h+='<div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:6px"><div class="tile i" style="padding:8px"><div class="lb">Ingresos</div><div class="v" style="font-size:14px">+'+money(inc)+'</div></div><div class="tile e" style="padding:8px"><div class="lb">Gastos</div><div class="v" style="font-size:14px">−'+money(exp)+'</div></div><div class="tile b" style="padding:8px"><div class="lb">Balance</div><div class="v" style="font-size:14px">'+money(inc-exp)+'</div></div></div>';
  if(!list.length)h+=empty('grafico','Sin movimientos en este período','Prueba con otro mes.');
  else{h+='<div class="card"><h2 class="t-h2" style="margin-bottom:8px">Gastos por categoría</h2>'+(donut(list)||'<p class="t-small">No hay gastos en este período.</p>')+'</div>';}
  h+='<div class="card"><h2 class="t-h2">Exportar este período</h2><p class="t-small" style="margin:4px 0 12px">Incluye los movimientos del período con su categoría y detalle.</p><div style="display:flex;gap:8px"><button class="btn secondary" style="flex:1" data-act="exp" data-v="CSV" aria-label="Exportar CSV">Exportar CSV</button><button class="btn secondary" style="flex:1" data-act="exp" data-v="PDF" aria-label="Exportar PDF">Exportar PDF</button></div></div>';
  return h+'</div>';
}
function vMore(a){
  var h='<div class="scroll">'+archivedBanner(a)+titleRow('mas','Más')+'<h2 class="t-small" style="font-weight:800;margin:8px 0 4px">CUENTA</h2><div class="menu-list">'+
   '<button class="mrow" data-act="dataToggle" aria-expanded="'+S.dataOpen+'"><span class="ticon f-cuenta" aria-hidden="true">✏️</span><span class="grow" style="flex:1"><b>Datos de cuenta</b><div class="t-small">Nombre de la cuenta</div></span><span aria-hidden="true">'+(S.dataOpen?'▾':'›')+'</span></button>';
  if(S.dataOpen)h+='<div class="field" style="padding:12px 0 4px" data-testid="datos-cuenta"><label for="an">Nombre de la cuenta</label><input id="an" value="'+esc(S.renameVal!==undefined?S.renameVal:a.nombre)+'" data-bind="rename" maxlength="60"><p class="hint">El saldo inicial no se puede cambiar. Si el saldo no coincide, anota un movimiento.</p><button class="btn primary block" style="margin-top:8px" data-act="rename">Guardar cambios</button></div>';
  h+='<button class="mrow" data-act="cats"><span class="ticon f-mas" aria-hidden="true">🏷️</span><span style="flex:1"><b>Categorías</b></span><span aria-hidden="true">›</span></button>'+
   '<button class="mrow" data-act="tab" data-t="reportes"><span class="ticon f-reportes" aria-hidden="true">📤</span><span style="flex:1"><b>Exportar</b></span><span aria-hidden="true">›</span></button></div>'+
   '<h2 class="t-small" style="font-weight:800;margin:12px 0 4px">SESIÓN</h2><div class="card"><div class="t-small">Conectado como</div><div style="font-weight:700;margin-bottom:12px">'+esc(S.user.email)+'</div><button class="btn secondary block" data-act="logout">Cerrar sesión</button></div>'+
   '<button class="link" data-act="adv" aria-expanded="'+S.advOpen+'" style="color:var(--expense-text)">'+(S.advOpen?'▾':'▸')+' Opciones avanzadas</button>';
  if(S.advOpen){
    if(a.archived)h+='<div class="card"><p class="t-small">Esta cuenta ya está archivada. Puedes desarchivarla desde Mis cuentas.</p></div>';
    else h+='<div class="card" style="border:1.5px solid #E9A79C"><h3 class="t-h2">Archivar esta cuenta</h3><p class="t-small" style="margin:4px 0 12px">La cuenta deja de aparecer en tu lista y no admite movimientos nuevos. Su historial se conserva y puedes desarchivarla.</p><button class="btn danger block" data-act="archive">Archivar cuenta</button><p class="t-small" style="margin-top:12px"><b>¿Quieres dejar de usar esta cuenta?</b> Archívala: tu historial queda guardado. Borrar tus datos por completo aún no está disponible en la app.</p></div>';
  }
  return h+'</div>';
}
function vCats(a){
  var list=CATS.filter(function(c){return c.tipo===S.catTipo;});
  return ctxBar(a,{mode:'readonly',exit:['backMore','Más','Volver a Más']})+'<div class="scroll">'+titleRow('mas','Categorías')+guide('cats','Las categorías ordenan tus gastos e ingresos. Puedes cambiarles el nombre y el color.')+
  '<div class="seg type" role="radiogroup" aria-label="Tipo de categoría"><button role="radio" aria-checked="'+(S.catTipo==='egreso')+'" class="gasto '+(S.catTipo==='egreso'?'sel':'')+'" data-act="ct" data-v="egreso">Gastos</button><button role="radio" aria-checked="'+(S.catTipo==='ingreso')+'" class="ingreso '+(S.catTipo==='ingreso'?'sel':'')+'" data-act="ct" data-v="ingreso">Ingresos</button></div>'+
  '<div class="card" style="padding:4px 16px">'+list.map(function(c){return '<div class="row">'+cicon(c)+'<span class="grow ttl">'+c.nombre+'</span><button class="link" aria-label="Acciones de '+c.nombre+'" data-act="demo">⋮</button></div>';}).join('')+'</div>'+(a.archived?'<p class="banner">Cuenta archivada: no se pueden crear ni desarchivar categorías.</p>':'<button class="btn secondary block" data-act="demo">+ Nueva categoría</button>')+'<p class="t-small" style="margin-top:12px">Demostración: en esta maqueta las categorías no se editan.</p></div>';
}
function vNewTx(a){
  var f=S.form,cl=CATS.filter(function(c){return c.tipo===f.tipo;});
  var d=f.fecha,dayLbl=d===TODAY?'Hoy':d===addDays(TODAY,-1)?'Ayer':dayLabel(d);
  var h=ctxBar(a,{mode:'compact'})+'<div class="hdr"><button class="back" data-act="cancelTx" aria-label="Cerrar">✕</button><h1 class="t-h2" style="flex:1">Nuevo movimiento</h1></div><div class="scroll ty-'+f.tipo+'">'+guide('newtx','Elige qué fue, escribe cuánto y listo. La fecha es hoy, pero puedes cambiarla.');
  h+='<div class="seg type" role="radiogroup" aria-label="Tipo de movimiento"><button role="radio" aria-checked="'+(f.tipo==='egreso')+'" class="gasto '+(f.tipo==='egreso'?'sel':'')+'" data-act="ftipo" data-v="egreso">Gasto</button><button role="radio" aria-checked="'+(f.tipo==='ingreso')+'" class="ingreso '+(f.tipo==='ingreso'?'sel':'')+'" data-act="ftipo" data-v="ingreso">Ingreso</button></div>';
  h+='<h2 class="t-h2" style="margin-top:8px">'+(f.tipo==='egreso'?'¿En qué fue?':'¿De dónde vino?')+'</h2><div class="cats">'+cl.map(function(c){return '<button class="catb '+(f.cat===c.id?'sel':'')+'" role="radio" aria-checked="'+(f.cat===c.id)+'" aria-label="Categoría '+c.nombre+'" data-act="fcat" data-v="'+c.id+'" title="'+c.nombre+'">'+cicon(c,true)+'<span>'+c.nombre+'</span></button>';}).join('')+'</div>';
  h+='<h2 class="t-h2">¿Cuánto?</h2><div class="amount '+(f.tipo==='egreso'?'amt-exp':'amt-inc')+'" aria-live="polite" aria-label="Monto">'+(f.tipo==='egreso'?'−':'+')+' $ '+(f.amt||'0')+'</div><div class="keypad">'+['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(function(k){return '<button data-act="key" data-k="'+k+'" aria-label="'+(k==='⌫'?'Borrar':k==='.'?'Punto decimal':k)+'">'+k+'</button>';}).join('')+'</div>';
  h+='<h2 class="t-h2">¿Cuándo?</h2><div class="chips"><button class="chip '+(d===TODAY?'sel':'')+'" data-act="fdate" data-v="'+TODAY+'">'+(d===TODAY?'✓ ':'')+'Hoy</button><button class="chip '+(d===addDays(TODAY,-1)?'sel':'')+'" data-act="fdate" data-v="'+addDays(TODAY,-1)+'">'+(d===addDays(TODAY,-1)?'✓ ':'')+'Ayer</button><span class="chip"><input type="date" id="od" aria-label="Otra fecha" data-bind="form.fecha" data-render="1" value="'+d+'" style="border:0;font:inherit;background:none"></span></div><p class="t-small">Fecha elegida: '+dayLbl+'</p>';
  h+='<div class="field" style="margin-top:12px"><label for="nt">Detalle (opcional)</label><input id="nt" data-bind="form.nota" value="'+esc(f.nota)+'" maxlength="500" placeholder="Almuerzo con Ana"></div><p class="exp" role="alert" id="err" style="margin-bottom:8px">'+(f.err?esc(f.err):'')+'</p>';
  h+='<button class="btn primary block" data-act="saveTx" aria-label="Guardar">'+(f.tipo==='egreso'?'Guardar gasto':'Guardar ingreso')+'</button></div>';
  return h;
}

/* ---------- render ---------- */
/* Marcadores para medir el área táctil efectiva (script Playwright):
   data-hit="48"       -> el propio elemento debe medir >= 48 px de alto y ancho (o cumplirlo con su fila).
   data-hit="extended" -> aspecto menor (36 px) con ::after de 48 px; medir getComputedStyle(el,'::after').height.
   data-hit="n/a"      -> decorativo o no interactivo. */
function markHits(){
  var q='button,[role="button"],[role="radio"],[role="tab"],a[href],input,select,textarea';
  document.querySelectorAll('#phone '+q).forEach(function(el){
    el.setAttribute('data-hit',el.classList.contains('chip')&&el.classList.contains('sm')?'extended':'48');
    if(el.closest('.seg'))el.setAttribute('data-hit-group','seg');
  });
}
function render(){renderBody();markHits();}
function renderBody(){
  var r=S.route,a=r.acc?acc():null,h='',sbar='',tabs=false;
  if(r.name==='login'){h=vLogin();}
  else if(r.name==='accounts')h=vAccounts();
  else if(r.name==='newAcc')h=vNewAcc();
  else if(r.name==='newTx'){h=vNewTx(a);sbar='surf';}
  else if(r.name==='cats'){h=vCats(a);sbar='surf';}
  else if(r.name==='account'){
    tabs=true;sbar='surf';
    h=ctxBar(a,S.tab==='cuenta'?{showBal:false}:S.tab==='reportes'?{balLabel:'saldo actual'}:{});
    h+=({cuenta:vAccountTab,movimientos:vHistory,calendario:vCalendar,reportes:vReports,mas:vMore})[S.tab](a);
  }
  document.getElementById('sbar').className='sbar'+(sbar?' '+sbar:'');
  document.getElementById('screen').innerHTML='<div class="screen-in" data-route="'+r.name+(r.name==='account'?':'+S.tab:'')+'" style="flex:1;min-height:0;display:flex;flex-direction:column;position:relative">'+h+(tabs?tabBar():'')+'</div>'+
    (S.sheet&&r.name==='accounts'?vSheet():'')+(S.snack?'<div class="snack" role="status">'+esc(S.snack)+'</div>':'')+
    (S.modal?'<div class="modal-bg"><div class="modal" role="alertdialog" aria-modal="true" aria-label="'+esc(S.modal.title)+'"><h2 class="t-h2">'+esc(S.modal.title)+'</h2><p class="t-body muted" style="margin-top:8px">'+esc(S.modal.body)+'</p><div class="acts"><button class="btn secondary" data-act="mcancel">Cancelar</button><button class="btn '+(S.modal.danger?'danger-solid':'primary')+'" data-act="mok">'+esc(S.modal.ok)+'</button></div></div></div>':'');
}
function openAcc(id){S.route={name:'account',acc:id};S.tab='cuenta';S.weekFilter='todos';S.month='2026-10';S.calSel=TODAY;S.dataOpen=false;S.advOpen=false;S.renameVal=undefined;S.hist={open:false,tipo:'todos',cat:'',from:'',to:''};S.rep={mode:'mes',month:'2026-10',year:'2026',from:'2026-10-01',to:'2026-10-15'};
  /* valor inicial: el saldo que ya trae la lista (GET /accounts) */
  S.ctxBal={value:balance(id),state:'ok'};render();}
function newTx(d){S.form={tipo:'egreso',cat:'',amt:'',fecha:d||TODAY,nota:'',err:'',origin:{tab:S.tab}};S.route={name:'newTx',acc:S.route.acc};render();}
function setPath(path,val){var p=path.split('.');if(p[0]==='rename'){S.renameVal=val;return;}var o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}

document.getElementById('phone').addEventListener('input',function(e){var b=e.target.getAttribute&&e.target.getAttribute('data-bind');if(b){setPath(b,e.target.value);if(e.target.getAttribute('data-render'))render();}});
document.getElementById('phone').addEventListener('change',function(e){var b=e.target.getAttribute&&e.target.getAttribute('data-bind');if(b&&e.target.getAttribute('data-render')){setPath(b,e.target.value);render();}});
document.getElementById('phone').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.getAttribute('data-act')==='sheetClose'&&e.target.closest('[data-stop]')&&!e.target.closest('.sheet [data-act="sheetClose"]'))return;
  if(el.getAttribute('aria-disabled')==='true')return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),a=S.route.acc?acc():null;
  switch(act){
   case 'login':nav({name:'accounts'});break;
   case 'logout':S.guides={};S.sheet=false;nav({name:'login'});break;
   case 'profile':S.sheet=true;render();break;
   case 'sheetClose':S.sheet=false;render();break;
   case 'guide':S.guides[el.getAttribute('data-k')]=1;render();break;
   case 'open':openAcc(id);break;
   case 'toAccounts':nav({name:'accounts'});break;
   case 'newacc':S.newAcc={nombre:'',saldo:''};nav({name:'newAcc'});break;
   case 'toggleArch':S.showArchived=!S.showArchived;render();break;
   case 'unarch':S.accounts.forEach(function(x){if(x.id===id)x.archived=false;});snack('Cuenta desarchivada');break;
   case 'createAcc':{var n=S.newAcc.nombre.trim(),sd=S.newAcc.saldo.trim(),err=document.getElementById('err');
     if(!n){err.textContent='Escribe un nombre.';break;}
     var c=sd===''?0:parseCents(sd);if(isNaN(c)){err.textContent='El saldo inicial no es válido. Usa el formato 1234.56.';break;}
     var na={id:'a'+(nid++),nombre:n,inicial:c,archived:false};S.accounts.splice(S.accounts.filter(function(x){return !x.archived;}).length,0,na);openAcc(na.id);snack('Cuenta '+n+' creada. Ya puedes anotar movimientos.');break;}
   case 'tab':S.tab=v||el.getAttribute('data-t');render();break;
   case 'wf':S.weekFilter=v;render();break;
   case 'mprev':S.month=shiftMonth(S.month,-1);S.calSel=S.month+'-01';render();break;
   case 'mnext':S.month=shiftMonth(S.month,1);S.calSel=S.month+'-01';render();break;
   case 'cday':S.calSel=el.getAttribute('data-d');render();break;
   case 'newtx':newTx(el.getAttribute('data-d'));break;
   case 'cancelTx':S.route={name:'account',acc:S.route.acc};S.form=null;render();break;
   case 'ftipo':S.form.tipo=v;S.form.cat='';render();break;
   case 'fcat':S.form.cat=v;render();break;
   case 'fdate':S.form.fecha=v;render();break;
   case 'key':{var k=el.getAttribute('data-k'),m=S.form.amt;
     if(k==='⌫')m=m.slice(0,-1);else if(k==='.'){if(m.indexOf('.')<0)m=(m||'0')+'.';}else{var t=m+k;if(/^\d{1,9}(\.\d{0,2})?$/.test(t)&&!/^0\d/.test(t))m=t;}
     S.form.amt=m;render();break;}
   case 'saveTx':{var f=S.form,cents=parseCents(f.amt);
     if(!f.cat){f.err='Elige una categoría.';render();break;}
     if(isNaN(cents)||cents<=0){f.err='Ingresa un monto mayor a cero, por ejemplo 12.50.';render();break;}
     S.txs.push({id:'t'+(nid++),acc:S.route.acc,tipo:f.tipo,cat:f.cat,monto:cents,fecha:f.fecha,nota:f.nota.trim(),voided:false});
     var cn=cat(f.cat).nombre,msg=(f.tipo==='egreso'?'Gasto de ':'Ingreso de ')+money(cents)+' guardado en '+cn;
     var back=f.origin.tab;S.form=null;S.route={name:'account',acc:S.route.acc};S.tab=back;
     if(f.fecha.slice(0,7)!==S.month){S.month=f.fecha.slice(0,7);}
     S.calSel=f.fecha;S.snack=msg;clearTimeout(snack.t);snack.t=setTimeout(function(){S.snack=null;render();},3000);
     refreshBalance();break;}
   case 'retryBal':refreshBalance();break;
   case 'tx':if(a.archived){snack('Cuenta archivada: no se pueden anular movimientos.');break;}
     S.modal={title:'Anular movimiento',body:'¿Anular este movimiento? Dejará de contar en tu saldo y en los reportes. Queda guardado como anulado.',ok:'Anular',danger:true,fn:function(){S.txs.forEach(function(t){if(t.id===id)t.voided=true;});S.modal=null;S.snack='Movimiento anulado';clearTimeout(snack.t);snack.t=setTimeout(function(){S.snack=null;render();},3000);refreshBalance();}};render();break;
   case 'filt':S.hist.open=!S.hist.open;render();break;
   case 'ht':S.hist.tipo=v;render();break;
   case 'hc':S.hist.cat=S.hist.cat===v?'':v;render();break;
   case 'happly':S.hist.open=false;render();break;
   case 'hclear':S.hist={open:false,tipo:'todos',cat:'',from:'',to:''};render();break;
   case 'hx':if(v==='tipo')S.hist.tipo='todos';if(v==='cat')S.hist.cat='';if(v==='rango'){S.hist.from='';S.hist.to='';}render();break;
   case 'rm':S.rep.mode=v;render();break;
   case 'rprev':case 'rnext':{var dd=act==='rprev'?-1:1;if(S.rep.mode==='mes')S.rep.month=shiftMonth(S.rep.month,dd);else S.rep.year=String(+S.rep.year+dd);render();break;}
   case 'exp':snack('Demostración: aquí se crearía el archivo '+v+' del período.');break;
   case 'cats':S.route={name:'cats',acc:S.route.acc};render();break;
   case 'backMore':S.route={name:'account',acc:S.route.acc};S.tab='mas';render();break;
   case 'ct':S.catTipo=v;render();break;
   case 'demo':snack('Demostración: sin edición en el prototipo.');break;
   case 'dataToggle':S.dataOpen=!S.dataOpen;render();break;
   case 'rename':{var nv=(S.renameVal!==undefined?S.renameVal:a.nombre).trim();if(!nv){snack('Escribe un nombre.');break;}a.nombre=nv;S.renameVal=undefined;snack('Nombre actualizado');break;}
   case 'adv':S.advOpen=!S.advOpen;render();break;
   case 'archive':S.modal={title:'Archivar cuenta',body:'¿Archivar «'+a.nombre+'»? Dejará de aparecer en tu lista y no podrás anotarle movimientos. Podrás desarchivarla cuando quieras.',ok:'Archivar',danger:true,fn:function(){a.archived=true;S.modal=null;S.showArchived=true;S.route={name:'accounts'};snack(a.nombre+' archivada. La encuentras en Archivadas.');}};render();break;
   case 'mcancel':S.modal=null;render();break;
   case 'mok':S.modal.fn();break;
   case 'noop':break;
  }
});
document.getElementById('size').addEventListener('change',function(e){document.getElementById('phone').className='phone'+(e.target.value?' '+e.target.value:'');});
render();
</script>
</body>
</html>
